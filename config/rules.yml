# Quy tắc nghiệp vụ (BGD chốt ngày 11/09/2026). Sửa ở đây, không sửa trong code.
vvip:
  goi_tinh_vvip: ["V.VIP", "V.VIP Plus"]   # V.VIP Plus ĐƯỢC tính vào V.VIP
  goi_fpt_play_khac: ["VIP", "KXD"]
camera:
  # BGĐ chốt lại 15/09/2026: bám theo file Inside như sheet - dòng giống hệt nhau vẫn đếm từng dòng
  gop_dong_trung_lap: false
fptplay:
  gop_dong_trung_lap: true
chua_gan_phong:
  cong_vao_tong_chi_nhanh: true
tham_nien:
  - {code: MOI,     ten: "1-3 tháng",          tu: 1,  den: 3}
  - {code: DANG_LEN, ten: "4-6 tháng",         tu: 4,  den: 6}
  - {code: ON_DINH, ten: "7-12 tháng",         tu: 7,  den: 12}
  - {code: LAU_NAM, ten: "Trên 12 tháng",      tu: 13, den: 999}
ngay_lam_viec:
  tuan_bat_dau: 1   # 1 = Thứ 2

# Ngưỡng tô màu (heatmap) cho bảng tổng quan - sửa tại đây nếu muốn khắt khe/dễ hơn
heatmap:
  htkh:        {rat_kem: 15, kem: 25, trung_binh: 35, kha: 50}
  tang_truong: {rat_kem: -10, kem: 0, trung_binh: 10, kha: 20}
  ty_le:       {rat_kem: 40, kem: 60, trung_binh: 75, kha: 85}

# Trang Phân tích bán hàng: tô màu tỷ lệ so với MỨC CHUNG (dòng tổng) của phạm vi đang xem
phan_tich:
  tot: 5          # cao hơn mức chung từ 5 điểm % -> xanh
  kem: 10         # thấp hơn mức chung từ 10 điểm % -> đỏ (5-10 điểm -> vàng)

# Năng suất lao động (file NSLĐ hằng tháng)
nsld:
  # Phòng trong file NSLĐ (theo PS) -> phòng trên app. Phòng chưa khai ở đây thì app tự đoán
  # theo danh mục nhân sự (phòng có nhiều acc trùng nhất); vẫn không đoán được thì giữ mã PS.
  phong_ps:
    DNGB1: IBB1
    DNGB2: IBB2
    DNGB3: IBB3
    DNGB4: IBB4
    DNGB5: IBB5
    DNGB6: IBB6
    DNGB7: IBB7
  vi_tri_tinh_binh_quan: NVKD   # chỉ dùng để đếm "Số NVKD"; NSLĐ phòng = tổng ITN / số người được xét (NVKD + CTV)

# Dòng TỔNG TOÀN CHI NHÁNH (và Tổng DNG / Tổng QNM) không cộng NHÂN SỰ và MỤC TIÊU của các phòng này,
# làm như Google Sheet (chốt 14/09/2026). ANCS vẫn hiện dòng riêng; số thực hiện vẫn tính đủ.
tong_chi_nhanh:
  khong_cong: [ANCS]

# MTTN (Miền Trung - Tây Nguyên): hợp đồng của các phòng dưới đây có CN Quản lý (tỉnh của khách) thuộc danh
# sách mã tỉnh thì tính là số MTTN. Mục tiêu = tỷ lệ % số online MTTN / số online phòng, nhập ở Quản trị →
# Chỉ tiêu (cột "Tỷ lệ MTTN %"). Chốt 18/09/2026: chỉ áp dụng IBB7.
mttn:
  ten: MTTN
  ten_day_du: Miền Trung - Tây Nguyên
  phong: [IBB7]
  cn_quan_ly: [BDH, DLK, DNG_01, DNG_02, GLI, HUE, KHA_01, KHA_02, KTM, PYN, QBH, QNM, QTI]

# Nhập tồn (trang /nhapton, app/nhap_ton.py): sale ghi tình trạng từng hợp đồng chưa online, Trưởng phòng theo dõi.
# Chốt 21/09/2026: chỉ IBB7. Trả về ngày D thì hạn xử lý là hết ngày D + han_tra_ve_ngay, quá hạn HĐ tự huỷ.
# Báo cáo đầu ngày (trang Báo cáo ngày): phòng nào dùng. Chốt 24/09/2026.
bao_cao_ngay:
  phong: [IBB7]

nhap_ton:
  phong: [IBB7]
  han_tra_ve_ngay: 3
  phuong_an: [Đang chờ triển khai, Huỷ, KH đang suy nghĩ - Chốt lại, Đã triển khai]
